<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="xRedGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A" />
      <stop offset="45%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="xRedGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#700000" />
    </linearGradient>
    <radialGradient id="badgeDarkBg" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#050505" />
      <stop offset="95%" stop-color="#120303" />
      <stop offset="100%" stop-color="#260404" />
    </radialGradient>
    <filter id="redShadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#E10600" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Circular Medallion -->
  <circle cx="250" cy="250" r="236" fill="url(#badgeDarkBg)" stroke="#E10600" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Modern Geometric Bold X Logo Structure -->
  <g filter="url(#redShadowGlow)">
    <!-- Primary Top-Left to Bottom-Right Diagonal Blade -->
    <path 
      d="M 125 105 L 185 105 L 375 395 L 315 395 Z" 
      fill="url(#xRedGradPrimary)" 
    />
    
    <!-- Secondary Top-Right to Bottom-Left Diagonal Blade (Crossed with dynamic gap) -->
    <path 
      d="M 375 105 L 315 105 L 265 182 L 295 228 L 375 105 Z" 
      fill="url(#xRedGradSecondary)" 
    />
    <path 
      d="M 235 272 L 205 318 L 125 395 L 185 395 L 250 295 Z" 
      fill="url(#xRedGradSecondary)" 
    />
    
    <!-- Subtle Center Intersect Accent Blade -->
    <polygon 
      points="250,225 275,250 250,275 225,250" 
      fill="#FF4D4D" 
      opacity="0.9"
    />
  </g>
</svg>
